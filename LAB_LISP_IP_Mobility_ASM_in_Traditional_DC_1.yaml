lab:
  description: Traditional Data Center Architecthure without a L2 DCI, using LISP
    IP Mobility ASM to be able to perform Cold Migrations
  notes: |-
    In this scenario, there is a scheduled outage on DC01 and we need to urgently migrate hosts to DC02. We will migrate them to their equivalent VLANs, but the IP space differs. We will use LISP ASM to solve the issue!
    <br/>
    <br/>
    ---> Usually the default route is learned via BGP by the ORs and is updated dynamically, but in this lab we are working only on the enterprise portion.
    <br/>
    <br/>
    ---> The L3 Private core is used for enterprise prefixes. The Core Router is used as a transit for the extended underlay (to avoid running a new connection /  BGP session between ORs and XTRs)
    <br/>
    <br/>
    ---> For lab clarity purposes, the MS/MR is running on a dedicated node. However, in reality this role can be implemented on the ORs, which will end up being PxTR / MS-MR nodes.
    <br/>
    <br/>
    ---> The xTRs here act as the Enterprise Gateway, and the ORs are just an extension of the underlay (in production, the FW pair will be between xTR and OR). This way, macro-segmentation is kept all the time and there is no need to merge VRFs at any point.
    <br/>
    <br/>
    ---> There is no need to configure any multicast settings on the xTRs: configuring the multicast group under the dynamic-EID is the whole config, and the LISP process sends and receives it on the interfaces where lisp mobility is enabled.
    <br/>
    <br/>
    ---> In production we will not disable IGMP Snooping for the Server VLANs, but here we do since the lab switches do not perform well with IGMP Snooping
    <br/>
    <br/>
    ---> Without any tuning, each site XTR is claiming the other local xTR with its own RLOCs. To avoid this, we can stretch the dynamic-eid prefix length as needed. For example, using a /25 excludes the SVI addresses, and if in the future we need more than 128 hosts, we can add entries of /26, /27, ...
    <br/>
    <br/>
    ---> We use VXLAN encapsulation because the C9Kv does not support LISP encapsulation when using a single LISP process with multiple IIDs in the mobility role.
  title: LAB LISP IP Mobility ASM in Traditional DC 1
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
